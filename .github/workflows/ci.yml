name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Check docs index
        if: runner.os == 'Linux'
        run: .claude/scripts/check-docs-index.sh
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # --continue: a failing module does not keep the others' tests from running and reporting.
      # UI tests (TestFX) run on Linux only, under Xvfb: on macOS they took 30 minutes and only ever failed for
      # reasons of their own. The macOS UI tests workflow runs them there on demand.
      - name: Build
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew build --continue
      - name: Build without UI tests
        if: runner.os == 'macOS'
        run: ./gradlew build -x uiTest --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
