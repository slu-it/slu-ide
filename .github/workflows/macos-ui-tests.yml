name: macOS UI tests

# The UI tests (TestFX) on the native macOS display, started by hand (Actions → macOS UI tests → Run workflow).
# CI skips them on macOS: they take about 30 minutes there.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI tests (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew uiTest --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-macos-latest
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
