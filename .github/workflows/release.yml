name: Release

# Publishes the fat jar of every platform to the GitHub Packages Maven registry of this repository
# (https://maven.pkg.github.com/slu-it/slu-ide) when a version tag such as v0.1.0 is pushed.
# JavaFX natives are platform specific (docs/adr/0003-javafx-platform-jars.md), so each platform is
# built on a matching runner and published as its own artifact: ide-<os>-<arch>.
# The macOS runner also attaches Thoreau-<version>-mac-aarch64.dmg (Thoreau.app with its own Java runtime, not
# notarized, docs/adr/0011-native-app-packaging.md) to the GitHub release of the tag.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create the GitHub release and attach the disk image
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # linux-x64, linux-aarch64, mac-aarch64 (no Intel Macs)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # UI tests run on Linux only, as in CI: on macOS they take about 30 minutes (macos-ui-tests.yml runs them).
      - name: Publish ide fat jar
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}./gradlew build ${{ runner.os == 'macOS' && '-x uiTest ' || '' }}:ide:publishFatJarPublicationToGitHubPackagesRepository -PreleaseVersion="${GITHUB_REF_NAME#v}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build disk image
        if: runner.os == 'macOS'
        run: ./gradlew :ide:jpackageDmg -PreleaseVersion="${GITHUB_REF_NAME#v}"
      - name: Attach disk image to the GitHub release
        if: runner.os == 'macOS'
        run: |
          dmg="Thoreau-${GITHUB_REF_NAME#v}-mac-aarch64.dmg"
          mv ide/build/jpackage/dmg/*.dmg "$dmg"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
