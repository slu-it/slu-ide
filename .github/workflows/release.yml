name: Release

# Publishes the fat jar of every platform to the GitHub Packages Maven registry of this repository
# (https://maven.pkg.github.com/slu-it/slu-ide) when a version tag such as v0.1.0 is pushed.
# JavaFX natives are platform specific (docs/adr/0003-javafx-platform-jars.md), so each platform is
# built on a matching runner and published as its own artifact: ide-<os>-<arch>.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # linux-x64, linux-aarch64, mac-aarch64, mac-x64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Publish ide fat jar
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}./gradlew build :ide:publishFatJarPublicationToGitHubPackagesRepository -PreleaseVersion="${GITHUB_REF_NAME#v}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
