# ALSA's default PCM device for the test tasks of the modules that play sound, on Linux without a sound card: an
# audio sink cannot open a missing device (JavaFX Media fails every player with "Could not create player!"). The null
# device discards the sound. Used by the root build.gradle.kts (nullAlsaProjects; docs/testing.md, "Media playback").
pcm.!default {
    type null
}
