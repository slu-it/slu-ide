[versions]
kotlin = "2.4.21"
spring-boot = "4.1.1"
javafx = "27"
java = "25"
ktlint = "1.8.0"
testfx = "4.0.18"
richtextfx = "0.11.7"
rsyntaxtextarea = "4.0.1"
pty4j = "0.14.0"
jediterm = "3.76"
ikonli = "12.4.0"
commonmark = "0.30.0"
jsoup = "1.23.2"
ec4j = "1.1.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-context = { module = "org.springframework:spring-context" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
richtextfx = { module = "org.fxmisc.richtext:richtextfx", version.ref = "richtextfx" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version.ref = "rsyntaxtextarea" }
pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }
jediterm-core = { module = "org.jetbrains.jediterm:jediterm-core", version.ref = "jediterm" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-materialdesign2 = { module = "org.kordamp.ikonli:ikonli-materialdesign2-pack", version.ref = "ikonli" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-ext-task-list-items = { module = "org.commonmark:commonmark-ext-task-list-items", version.ref = "commonmark" }
commonmark-ext-autolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "commonmark" }
commonmark-ext-heading-anchor = { module = "org.commonmark:commonmark-ext-heading-anchor", version.ref = "commonmark" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
ec4j-core = { module = "org.ec4j.core:ec4j-core", version.ref = "ec4j" }
# Version from the Spring Boot BOM (Jackson 3).
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
# Version from the Spring Boot BOM.
snakeyaml = { module = "org.yaml:snakeyaml" }

[bundles]
commonmark = [
    "commonmark",
    "commonmark-ext-gfm-tables",
    "commonmark-ext-gfm-strikethrough",
    "commonmark-ext-task-list-items",
    "commonmark-ext-autolink",
    "commonmark-ext-heading-anchor",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
