# ALSA's default PCM device for the media tests on Linux without a sound card: JavaFX Media's ALSA sink cannot open
# a missing device, and every player fails with "Could not create player!". The null device discards the sound.
# Used only by the test tasks in ../../../build.gradle.kts (docs/testing.md, "Media playback").
pcm.!default {
    type null
}
