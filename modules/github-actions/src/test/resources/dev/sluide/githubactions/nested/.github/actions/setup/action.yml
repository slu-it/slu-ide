name: Set up Java
inputs:
  java:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java }}
    - uses: ./.github/actions/greet
      if: runner.os == 'Linux'
    - name: Show version
      run: java -version
      shell: bash
