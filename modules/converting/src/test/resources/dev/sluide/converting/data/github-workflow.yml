name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
env:
  FEATURE: off
  JAVA_VERSION: '25'
  COUNTRY: NO
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Build
        run: |
          ./gradlew build
          echo "done: ${{ github.sha }}"
        if: github.event_name == 'push'
